name: Release

# Publishes a GitHub release with the Chrome and Firefox archives.
# Usage: update "version" in package.json, then
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # See ci.yml: the Windows lockfile doesn't include the Linux variants.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ($TAG) does not match the package.json version ($PKG)." >&2
            exit 1
          fi

      - name: Check types
        run: npm run compile

      - name: Generate archives
        run: |
          npm run zip
          npm run zip:firefox

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .output/*.zip \
            --title "FACEIT+ $GITHUB_REF_NAME" \
            --generate-notes
