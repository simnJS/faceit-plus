name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Vérification et build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run compile

      - name: Build Chrome
        run: npm run build

      - name: Build Firefox
        run: npm run build:firefox

      - name: Générer les archives
        run: |
          npm run zip
          npm run zip:firefox

      - name: Publier les archives comme artefacts
        uses: actions/upload-artifact@v4
        with:
          name: faceit-plus-${{ github.sha }}
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 30
