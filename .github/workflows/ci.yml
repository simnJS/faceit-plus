name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install rather than npm ci: the lockfile is generated on Windows
      # and doesn't list the Linux-specific optional dependencies there.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check types
        run: npm run compile

      - name: Build Chrome
        run: npm run build

      - name: Build Firefox
        run: npm run build:firefox

      - name: Generate archives
        run: |
          npm run zip
          npm run zip:firefox

      - name: Upload archives as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: faceit-plus-${{ github.sha }}
          path: .output/*.zip
          # .output starts with a dot: without this option, the action ignores
          # files it considers hidden and uploads nothing.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
